name: Update NFL scores and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nfl-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check NFL scoring and data validation
        run: npm test

      - name: Refresh season data
        id: scores
        continue-on-error: true
        run: npm run update

      - name: Keep the last valid snapshot if the feed fails
        if: steps.scores.outcome == 'failure'
        run: |
          git restore data/season.json
          echo '::warning::NFL refresh failed. Publishing the last saved scores.'

      - name: Confirm season data exists
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import { SEASON } from "./scripts/nfl-data.mjs"; const d=JSON.parse(fs.readFileSync("data/season.json")); if(d.season!==SEASON || d.teamRecords.length!==32) throw new Error("No valid saved season data.");'

      - name: Save the refreshed snapshot
        run: |
          git config user.name 'NFL score updater'
          git config user.email 'nfl-updater@users.noreply.github.com'
          git add data/season.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update NFL scores'
            git push
          fi

      - uses: actions/configure-pages@v5

      - name: Stage the public website
        run: |
          mkdir -p public/data public/pictures
          cp index.html style.css script.js draft.json public/
          cp data/season.json public/data/
          cp pictures/Michael.webp pictures/Zach.webp public/pictures/
          cp -r pictures/teams public/pictures/
          cp -r History public/
          mkdir -p public/scripts
          cp scripts/live-data.mjs scripts/nfl-data.mjs public/scripts/
          touch public/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - uses: actions/deploy-pages@v4
        id: deployment